{% if missing_reports %}
<style>
	.report-warning { position: relative; color: var(--pico-muted-color); cursor: help; font-size: .85rem; }
	.report-warning [role="tooltip"] { visibility: hidden; position: absolute; top: 100%; left: 0; z-index: 20; width: min(24rem, 70vw); max-height: 50vh; overflow-y: auto; padding: .6rem .8rem; border: 1px solid var(--pico-muted-border-color); border-radius: var(--pico-border-radius); background: var(--pico-background-color); color: var(--pico-color); font-size: .8rem; font-weight: normal; box-shadow: var(--pico-box-shadow); }
	.report-warning:hover [role="tooltip"], .report-warning:focus [role="tooltip"] { visibility: visible; }
	.report-warning ul { margin: .35rem 0 0; padding-left: 1.2rem; }
</style>
<span class="report-warning" tabindex="0" role="img" aria-label="Missing or failed exercise reports" aria-describedby="missing-reports-tooltip">
	<span aria-hidden="true">&#9888;</span>
	<span id="missing-reports-tooltip" role="tooltip">
		Missing/failed report for following exercises:
		<ul>
			{% for missing in missing_reports %}
			<li>{{ missing.exercise_name }}</li>
			{% endfor %}
		</ul>
	</span>
</span>
{% endif %}
