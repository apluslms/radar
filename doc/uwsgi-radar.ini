[uwsgi]
single-interpreter=true
chdir=/srv/radar/radar
home=/srv/radar/venv
module=radar.wsgi:application
socket=/run/radar/web-uwsgi.socket
master-fifo=/run/radar/web-uwsgi.master
stats=/run/radar/uwsgi.stats
uid=radar
gid=radar
master=True
processes=4
chmod=666
touch-chain-reload=/srv/radar/uwsgi-radar.ini
